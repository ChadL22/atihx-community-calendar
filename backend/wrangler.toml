# Cloudflare Worker configuration for the ATIHx Community Calendar API.
# See SETUP.md for the step-by-step guide.

name = "atih-community-cal"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Headless Chrome for the Luma bot (Cloudflare Browser Rendering).
browser = { binding = "BROWSER" }

# Serves the review page at /admin from ./public
[assets]
directory = "./public"

# The database. Run `npx wrangler d1 create atih-community-cal` once and paste
# the database_id it prints below.
[[d1_databases]]
binding = "DB"
database_name = "atih-community-cal"
database_id = "PASTE-YOUR-DATABASE-ID-HERE"

[vars]
ENVIRONMENT = "production"

# "false" = a community lead approves each event before it goes live.
# "true"  = events go live as soon as they pass the bot check. Anything that
#           looks like a duplicate still waits for review either way.
AUTO_PUBLISH = "false"

# The website(s) allowed to send submissions, comma separated, no trailing slash.
# Replace with your GitHub Pages address, e.g. "https://chadl22.github.io"
ALLOWED_ORIGINS = "https://YOUR-USERNAME.github.io,http://localhost:8000"

# From Cloudflare Zero Trust → Access → Applications (see SETUP.md step 6).
ACCESS_TEAM_DOMAIN = "https://YOUR-TEAM.cloudflareaccess.com"
ACCESS_AUD = "PASTE-YOUR-ACCESS-AUD-TAG-HERE"

# The Luma calendar the bot submits to, and the name of Luma's sign-in cookie.
LUMA_CALENDAR_URL = "https://luma.com/AllTechIsHuman"
LUMA_COOKIE_NAME = "luma.auth-session-key"

# The Luma bot (see SETUP.md, "Sending events to Luma").
# Every 2 minutes it submits any queued events to Luma. It does nothing
# (and uses no browser time) when the queue is empty.
[triggers]
crons = ["*/2 * * * *"]

# Secrets: set these with `npx wrangler secret put NAME`, never in this file.
#   TURNSTILE_SECRET   from Cloudflare Turnstile
#   IP_HASH_SALT       any long random string
#   LUMA_SESSION       the Luma bot account's sign-in cookie (SETUP.md explains how to copy it)

# Local development: `npx wrangler dev` reads .dev.vars, which overrides the
# values above (see .dev.vars.example).
